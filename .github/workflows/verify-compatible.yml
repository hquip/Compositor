name: Verify compatible desktop
on:
  push:
    paths: ['desktop/**', '.github/workflows/verify-compatible.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/verify-compatible.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatible-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Build and test native Linux desktop
        working-directory: desktop
        run: |
          node scripts/build-compatible.mjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          node node_modules/@tauri-apps/cli/tauri.js build --bundles deb,appimage
      - uses: actions/upload-artifact@v7
        with:
          name: Compositor-Linux-compatible
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
  mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Build universal macOS-compatible desktop
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          node scripts/build-compatible.mjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          node node_modules/@tauri-apps/cli/tauri.js build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Compositor-macOS-compatible
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
