name: Verify

on:
  push:
    paths: ['Compositor/**', 'CompositorTests/**', 'CompositorUITests/**', 'Compositor.xcodeproj/**', 'Config/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['Compositor/**', 'CompositorTests/**', 'CompositorUITests/**', 'Compositor.xcodeproj/**', 'Config/**', '.github/workflows/verify.yml']
  workflow_call:
    inputs:
      windows-fixture:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the project and preview generated by Windows
        if: inputs.windows-fixture
        uses: actions/download-artifact@v7
        with:
          name: Windows-compatibility-fixture
          path: CompositorTests/Fixtures

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-

      # These two suites show real windows and time them, so they run alone after the rest.
      - name: Run unit tests in parallel
        run: >
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath ParallelResults.xcresult
          -parallel-testing-enabled YES
          -skip-testing:CompositorTests/FloatingPanelTests
          -skip-testing:CompositorTests/SliderSnapTests

      - name: Run window tests serially
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath SerialResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/SliderSnapTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '*.xcresult'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Mac project, render, and comparison metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mac-compatibility-results
          path: CrossPlatformResults/
          retention-days: 7
          if-no-files-found: warn
